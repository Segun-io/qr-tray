<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>QR Tray</title>
    <style>

      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 360px;
        height: 480px;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f2f2f5;
        color: #1c1c1e;
      }
      #app {
        display: flex;
        flex-direction: column;
        height: 100%;
      }

      #list-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 16px;
      }
      #list-header h1 {
        font-size: 18px;
        margin: 0;
      }
      #btn-new {
        border: none;
        background: #34c759;
        color: white;
        font-weight: 600;
        font-size: 13px;
        padding: 8px 14px;
        border-radius: 20px;
        cursor: pointer;
      }
      #list {
        list-style: none;
        margin: 0;
        padding: 0 12px 12px;
        overflow-y: auto;
        flex: 1;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: white;
        border-radius: 14px;
        padding: 14px 16px;
        margin-bottom: 8px;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.06);
        cursor: pointer;
      }
      .row-label {
        font-size: 14px;
        font-weight: 500;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .row-delete {
        border: none;
        background: transparent;
        font-size: 14px;
        cursor: pointer;
        opacity: 0.5;
        padding: 4px;
      }
      .row-delete:hover {
        opacity: 1;
      }
      #empty-state {
        text-align: center;
        color: #8e8e93;
        font-size: 13px;
        margin-top: 60px;
        padding: 0 24px;
        line-height: 1.5;
      }

      #form-new {
        display: flex;
        flex-direction: column;
        gap: 14px;
        padding: 20px 16px;
      }
      #form-new label {
        display: flex;
        flex-direction: column;
        gap: 6px;
        font-size: 12px;
        color: #6e6e73;
      }
      #form-new input,
      #form-new textarea {
        font-family: inherit;
        font-size: 14px;
        border: 1px solid #d1d1d6;
        border-radius: 10px;
        padding: 10px;
        resize: none;
      }
      #input-text {
        height: 90px;
      }

      #detail {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 16px;
        flex: 1;
      }
      #btn-back {
        align-self: flex-start;
        border: none;
        background: transparent;
        font-size: 14px;
        color: #007aff;
        cursor: pointer;
        padding: 4px 0 12px;
      }
      #detail-label {
        font-size: 17px;
        margin: 0 0 16px;
        text-align: center;
      }
      #detail-qr {
        width: 240px;
        height: 240px;
        border-radius: 12px;
        background: white;
        padding: 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
      #detail-text {
        margin-top: 16px;
        font-size: 12px;
        color: #6e6e73;
        word-break: break-all;
        text-align: center;
        max-width: 280px;
      }

      .form-actions {
        display: flex;
        gap: 10px;
        margin-top: auto;
        width: 100%;
      }
      .form-actions button {
        flex: 1;
        border: none;
        border-radius: 20px;
        padding: 10px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      #btn-cancel {
        background: #e5e5ea;
        color: #1c1c1e;
      }
      #form-new button[type="submit"] {
        background: #34c759;
        color: white;
      }
      #btn-delete {
        background: #ff3b30;
        color: white;
      }

      [hidden] {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header id="list-header">
        <h1>Mis códigos</h1>
        <button id="btn-new" type="button">+ Nuevo</button>
      </header>

      <ul id="list"></ul>
      <p id="empty-state" hidden>
        Todavía no guardaste ningún código.<br />
        Tocá “+ Nuevo” para crear el primero.
      </p>

      <form id="form-new" hidden>
        <label>
          Nombre (opcional)
          <input id="input-label" placeholder="Ej: Pedido #4521" />
        </label>
        <label>
          Texto o ID a convertir
          <textarea id="input-text" required></textarea>
        </label>
        <div class="form-actions">
          <button type="button" id="btn-cancel">Cancelar</button>
          <button type="submit">Guardar</button>
        </div>
      </form>

      <div id="detail" hidden>
        <button id="btn-back" type="button">← Volver</button>
        <h2 id="detail-label"></h2>
        <img id="detail-qr" alt="Código QR" />
        <code id="detail-text"></code>
        <div class="form-actions">
          <button id="btn-delete" type="button">Eliminar</button>
        </div>
      </div>
    </div>
    <script src="dist/renderer.js"></script>
  </body>
</html>
